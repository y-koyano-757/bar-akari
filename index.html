<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BAR「灯」</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#0d0d0d;
font-family:"Yu Gothic UI",sans-serif;
color:white;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

background-image:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
radial-gradient(circle at center,#4b2d1d,#111);

}

.container{

width:900px;
max-width:90%;
text-align:center;

}

h1{

font-size:56px;
letter-spacing:10px;

margin-bottom:10px;

}

.subtitle{

color:#cccccc;

margin-bottom:40px;

font-size:20px;

}

.door{

width:220px;

height:340px;

background:#6a432e;

margin:auto;

border:8px solid #3d2418;

border-radius:8px;

cursor:pointer;

transition:.4s;

box-shadow:0 0 40px rgba(255,180,80,.15);

position:relative;

}

.door:hover{

transform:scale(1.03);

box-shadow:0 0 60px rgba(255,220,150,.6);

}

.knob{

position:absolute;

right:22px;

top:165px;

width:18px;

height:18px;

background:gold;

border-radius:50%;

}

.message{

margin-top:35px;

font-size:22px;

line-height:1.8;

color:#eeeeee;

}

</style>

</head>

<body>

<div class="container">

<h1>BAR「灯」</h1>

<div class="subtitle">

扉を開けてください

</div>

<div class="door">

<div class="knob"></div>

</div>

<div class="message">

お疲れ様。<br>

今日はどんな夜にしますか？

</div>

</div>

</body>

</html>
