<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BAR「灯」</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#0d0d0d;
font-family:"Yu Gothic UI",sans-serif;
color:white;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

background-image:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
radial-gradient(circle at center,#4b2d1d,#111);

}

.container{

width:900px;
max-width:90%;
text-align:center;

}

h1{

font-size:56px;
letter-spacing:10px;

margin-bottom:10px;

}

.subtitle{

color:#cccccc;

margin-bottom:40px;

font-size:20px;

}

.door{

width:220px;

height:340px;

background:#6a432e;

margin:auto;

border:8px solid #3d2418;

border-radius:8px;

cursor:pointer;

transition:.4s;

box-shadow:0 0 40px rgba(255,180,80,.15);

position:relative;

}

.door:hover{

transform:scale(1.03);

box-shadow:0 0 60px rgba(255,220,150,.6);

}

.knob{

position:absolute;

right:22px;

top:165px;

width:18px;

height:18px;

background:gold;

border-radius:50%;

}

.message{

margin-top:35px;

font-size:22px;

line-height:1.8;

color:#eeeeee;

}

</style>

</head>

<body>

<div class="container">

<h1>BAR「灯」</h1>

<div class="subtitle">

扉を開けてください

</div>

<div class="door">

<div class="knob"></div>

</div>

<div class="message">

お疲れ様。<br>

今日はどんな夜にしますか？

</div>

</div>
<style>
.rooms{
  display:none;
  margin-top:30px;
  animation:fadeIn 1.2s ease;
}

.rooms h2{
  margin-bottom:20px;
  font-weight:normal;
  letter-spacing:3px;
}

.room-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  max-width:650px;
  margin:auto;
}

.room{
  display:block;
  padding:15px 12px;
  border:1px solid rgba(255,215,160,.35);
  border-radius:8px;
  background:rgba(60,25,20,.65);
  color:#fff;
  text-decoration:none;
  transition:.3s;
}

.room:hover{
  background:#7b1818;
  border-color:#d7a15c;
  transform:translateY(-2px);
}

.special{
  grid-column:1 / -1;
  border-color:#d7a15c;
}

.door.open{
  transform:perspective(700px) rotateY(-75deg);
  transform-origin:left center;
  opacity:.15;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(15px);}
  to{opacity:1;transform:translateY(0);}
}

@media(max-width:600px){
  .room-grid{
    grid-template-columns:1fr;
  }

  .special{
    grid-column:auto;
  }
}
</style>

<div class="rooms" id="rooms">
  <h2>今日はどちらへ？</h2>

  <div class="room-grid">
    <a class="room" href="#">🍷 メインカウンター</a>
    <a class="room" href="#">💬 雑談室</a>
    <a class="room" href="#">📖 『最後の花火』</a>
    <a class="room" href="#">🎵 音楽室</a>
    <a class="room" href="#">🖼 ギャラリー</a>
    <a class="room" href="#">🌙 思い出の部屋</a>
    <a class="room special" href="#">⭐ ピーターパン専用席</a>
  </div>
</div>

<script>
const door = document.querySelector(".door");
const rooms = document.getElementById("rooms");
const subtitle = document.querySelector(".subtitle");
const message = document.querySelector(".message");

door.addEventListener("click", function(){

  door.classList.add("open");

  subtitle.textContent = "カラン……";

  message.innerHTML =
    "お疲れ様。<br>今日はどっち？";

  setTimeout(function(){
    door.style.display = "none";
    rooms.style.display = "block";
  },700);

});

</script>

  
</body>

</html>
